name: Build multi-architecture release images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing prerelease tag to attach the image to
        required: true
        default: v0.2.0

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: Build and verify ${{ matrix.platform }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
          - platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Build architecture image
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${RELEASE_TAG#v}"
          registry_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/writide"
          docker buildx build --platform "$PLATFORM" --load \
            --tag "$registry_image:${version}-${ARCH}" \
            --tag "$registry_image:latest-${ARCH}" .
          echo "REGISTRY_IMAGE=$registry_image" >> "$GITHUB_ENV"
      - name: Smoke test container
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          container_id=$(docker run -d --platform "$PLATFORM" \
            -p 127.0.0.1:5173:5173 \
            "$REGISTRY_IMAGE:${version}-${ARCH}")
          trap 'docker logs "$container_id"; docker rm -f "$container_id"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:5173/api/health >/dev/null; then
              curl --fail --silent --user admin:password http://127.0.0.1:5173/ >/dev/null
              exit 0
            fi
            sleep 1
          done
          exit 1
      - name: Publish verified image to GHCR
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          docker push "$REGISTRY_IMAGE:${version}-${ARCH}"
          docker push "$REGISTRY_IMAGE:latest-${ARCH}"
          docker buildx imagetools inspect "$REGISTRY_IMAGE:${version}-${ARCH}"
      - name: Export image and checksums
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          archive="Writide-${RELEASE_TAG}-linux-${ARCH}.tar.gz"
          docker tag "$REGISTRY_IMAGE:${version}-${ARCH}" "$REGISTRY_IMAGE:${version}"
          docker save "$REGISTRY_IMAGE:${version}-${ARCH}" "$REGISTRY_IMAGE:${version}" | gzip -9 > "$archive"
          sha256sum "$archive" > "${archive}.sha256"
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          ARCH: ${{ matrix.arch }}
        run: gh release upload "$RELEASE_TAG" Writide-"$RELEASE_TAG"-linux-"$ARCH".tar.gz* --clobber

  manifest:
    name: Publish combined amd64 and arm64 tags
    needs: image
    runs-on: ubuntu-latest
    steps:
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Publish and inspect multi-architecture manifests
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          registry_image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/writide"
          docker buildx imagetools create \
            --tag "$registry_image:${version}" \
            "$registry_image:${version}-amd64" \
            "$registry_image:${version}-arm64"
          docker buildx imagetools create \
            --tag "$registry_image:latest" \
            "$registry_image:latest-amd64" \
            "$registry_image:latest-arm64"
          docker buildx imagetools inspect "$registry_image:${version}"
